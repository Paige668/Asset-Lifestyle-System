services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: itasset-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      # Bound to localhost so the database is not reachable from outside the host
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  backend:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: itasset-backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ITAssetManager;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      - sqlserver
    restart: unless-stopped

volumes:
  sqlvolume:
